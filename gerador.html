<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Ícone Fibrasol</title>
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f1f5f9;font-family:sans-serif;">
    <button onclick="gerarIcone()" style="padding:16px 24px;background:#152e50;color:white;border:none;border-radius:12px;font-size:16px;cursor:pointer;font-weight:bold;box-shadow:0 4px 6px rgba(0,0,0,0.1);">Gerar e Baixar icon.png</button>
    <canvas id="canvas" width="512" height="512" style="display:none;"></canvas>
    <script>
        function gerarIcone() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            // Fundo azul #152e50 com cantos arredondados
            ctx.fillStyle = '#152e50';
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(0, 0, 512, 512, 128);
            } else {
                ctx.rect(0, 0, 512, 512);
            }
            ctx.fill();

            // Configurações do traçado branco do caminhão
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 20;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // Corpo do caminhão
            ctx.strokeRect(112, 176, 176, 160);
            
            // Cabine do caminhão
            ctx.beginPath();
            ctx.moveTo(288, 224);
            ctx.lineTo(368, 224);
            ctx.lineTo(400, 272);
            ctx.lineTo(400, 336);
            ctx.lineTo(288, 336);
            ctx.closePath();
            ctx.stroke();

            // Rodas
            ctx.beginPath();
            ctx.arc(176, 352, 32, 0, Math.PI * 2);
            ctx.arc(336, 352, 32, 0, Math.PI * 2);
            ctx.stroke();

            // Linhas internas da carroceria
            ctx.beginPath();
            ctx.moveTo(128, 224);
            ctx.lineTo(256, 224);
            ctx.moveTo(128, 256);
            ctx.lineTo(224, 256);
            ctx.stroke();

            // Acionamento do download automático do arquivo PNG
            const link = document.createElement('a');
            link.download = 'icon.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
