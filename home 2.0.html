<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#152e50">
    <link rel="manifest" href="manifest.json">
    <title>Logística Fibrasol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Ajuste para preencher perfeitamente telas mobile modernas com notch/safe-areas */
        body {
            min-height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
    </style>
</head>
<body class="bg-[#f8faf8] h-[100dvh] flex items-center justify-center p-4 font-sans text-slate-800 overflow-hidden select-none">

    <div class="w-full max-w-sm h-full max-h-[600px] bg-white rounded-3xl p-6 shadow-xl border border-slate-100 flex flex-col justify-between">
        
        <!-- Topo: Alerta e Configurações -->
        <div class="flex items-center justify-between">
            <button onclick="forcarAtualizacaoPwa()" class="bg-[#fac043] hover:brightness-95 active:scale-95 text-slate-900 text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-2 shadow-sm transition-all">
                <i class="fa-solid fa-rotate"></i> Atualização disponível
            </button>
            <button onclick="abrirModalConfig()" class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 active:scale-95 border border-slate-200 text-[#152e50] flex items-center justify-center transition-all">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>
        </div>

        <!-- Centro: Logo e Descrição -->
        <div class="text-center space-y-4 my-auto py-4">
            <div class="w-20 h-20 bg-[#152e50] text-[#fac043] rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-[#152e50]/20 text-3xl">
                <i class="fa-solid fa-truck-fast"></i>
            </div>
            <div class="space-y-1">
                <h1 class="text-2xl font-black text-[#152e50] tracking-tight">Logística Fibrasol</h1>
                <p class="text-xs text-slate-500 font-medium">Precisão e controle em cada entrega</p>
            </div>
        </div>

        <!-- Rodapé do Card: Botões de Ação -->
        <div class="space-y-3">
            <button onclick="mostrarTelaComAnimacao('screenRoleSelection')" class="w-full py-4 bg-[#152e50] hover:bg-[#0f223d] active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-[#152e50]/25 transition-all text-sm flex items-center justify-center gap-2">
                <span>Entrar</span>
            </button>
            
            <a href="https://wa.me/5573999999999" target="_blank" class="w-full py-3.5 bg-white hover:bg-slate-50 active:scale-[0.98] border border-slate-200 text-slate-700 font-semibold rounded-2xl transition-all text-xs flex items-center justify-center gap-2 shadow-sm">
                <i class="fa-brands fa-whatsapp text-emerald-600 text-base"></i>
                <span>Suporte via WhatsApp</span>
            </a>

            <div class="text-center pt-1">
                <span class="text-[10px] text-slate-400 font-mono app-version-text">gbsj17 v1.1.5</span>
            </div>
        </div>

    </div>

</body>
</html>
